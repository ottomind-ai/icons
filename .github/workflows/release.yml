name: Release

# On main: opens a "Version Packages" PR from pending changesets;
# merging that PR stages both packages on npm (`npm stage publish`).
# A staged version goes live only after a maintainer approves it with 2FA
# (npmjs.com → account settings → Staged Packages, or `npm stage approve <id>`).
# The site (GitHub Pages) deploys whenever main has no pending changesets.
#
# npm auth: trusted publishing (OIDC), stage-only. No npm token is stored in GitHub,
# and a direct `npm publish` from this workflow is rejected by npm.
on:
  push:
    branches: [main]
  workflow_dispatch: # run by hand to redeploy the site

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC token for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # staged publishing needs Node >= 22.14 and npm >= 11.15
          # no registry-url: it makes setup-node write a placeholder auth token,
          # which npm can pick up instead of the OIDC (trusted publishing) token
      - run: npm install -g npm@latest # the npm bundled with Node can lag behind staged publishing
      - run: npm ci
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release # scripts/stage.mjs: stages versions not yet on npm
          createGithubReleases: false # a staged version is not released until it is approved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site:
    needs: release
    # always(): an npm problem should not hold back the site
    if: always() && (needs.release.outputs.hasChangesets == 'false' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
