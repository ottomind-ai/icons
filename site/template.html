<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ottomind icons</title>
<meta name="description" content="Open-source 16×16 pixel icons by ottomind. React components, SVG, sprite and Iconify.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b; --panel: #111113; --card: #141417; --line: #2e2e33; --line-soft: #232327;
    --text: #edebe3; --muted: #8e8a82; --brand: #b3202a; --brand-hi: #cc5f65;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f2ef; --panel: #ffffff; --card: #ffffff; --line: #d9d6cf; --line-soft: #e6e3dd; --text: #141416; --muted: #6b675f; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .mono, code { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .lbl { font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; background: transparent; border: 1px solid var(--line); cursor: pointer; font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .4px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: #c42733; }

  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 22px 28px; border-bottom: 1px solid var(--line-soft); }
  .wordmark { font: 600 20px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: -.02em; }
  .wordmark b { color: var(--brand); }
  header .meta { color: var(--muted); font-size: 13px; }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  .toolbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-soft); }
  .toolbar input[type=search] { flex: 1 1 260px; min-width: 200px; height: 36px; background: var(--panel); border: 1px solid var(--line); padding: 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); }
  .seg button { height: 30px; min-width: 40px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: 500 12px "IBM Plex Mono", monospace; }
  .seg button[aria-pressed=true] { background: var(--text); color: var(--bg); }
  .toolbar label { display: inline-flex; align-items: center; gap: 8px; }
  input[type=color] { width: 28px; height: 22px; border: 1px solid var(--line); padding: 0; background: none; cursor: pointer; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 28px 0; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 5px 10px; cursor: pointer; font: 500 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1px; text-transform: uppercase; }
  .chip[aria-pressed=true] { color: var(--text); border-color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 16px 28px 48px; }
  .icon { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; aspect-ratio: 1; background: var(--card); border: 1px solid var(--line-soft); color: var(--text); cursor: pointer; padding: 10px; }
  .icon:hover, .icon:focus-visible { border-color: var(--muted); outline: none; }
  .icon[aria-selected=true] { border-color: var(--brand); }
  .icon span { font-size: 11px; color: var(--muted); text-align: center; word-break: break-word; font-family: "IBM Plex Mono", monospace; }
  .empty { padding: 40px 28px; color: var(--muted); }

  aside { position: fixed; right: 20px; bottom: 20px; width: min(400px, calc(100vw - 40px)); background: var(--panel); border: 1px solid var(--line); padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.4); display: none; z-index: 3; }
  aside.open { display: block; }
  .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .pixview { display: grid; place-items: center; padding: 14px; background: var(--bg); border: 1px solid var(--line-soft); margin-bottom: 14px; }
  .pixview svg { width: 192px; height: 192px; }
  aside h2 { margin: 0 0 2px; font: 600 15px/1.3 "IBM Plex Mono", monospace; }
  aside p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .btn { justify-content: center; }

  /* editor */
  dialog { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0; width: min(760px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .ed { display: grid; grid-template-columns: auto 1fr; gap: 22px; padding: 22px; }
  @media (max-width: 640px) { .ed { grid-template-columns: 1fr; } }
  .board { display: grid; grid-template-columns: repeat(16, 22px); grid-template-rows: repeat(16, 22px); border: 1px solid var(--line); touch-action: none; user-select: none; background: var(--bg); }
  .board div { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
  .board div.pad { background: repeating-linear-gradient(45deg, transparent 0 3px, color-mix(in srgb, var(--line) 60%, transparent) 3px 4px); }
  .board div.m { background: var(--text); }
  .ed h3 { margin: 0 0 12px; font: 600 15px/1.2 "IBM Plex Mono", monospace; }
  .ed .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .ed input[type=text] { height: 34px; background: var(--bg); border: 1px solid var(--line); padding: 0 10px; width: 100%; }
  .previews { display: flex; gap: 18px; align-items: flex-end; padding: 14px; background: var(--bg); border: 1px solid var(--line-soft); margin-bottom: 12px; }
  .previews figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
  .previews figcaption { font: 11px "IBM Plex Mono", monospace; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--text); color: var(--bg); padding: 8px 14px; font: 12px "IBM Plex Mono", monospace; transition: .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="wordmark"><b>&gt;</b>ottomind icons</div>
  <div class="meta" id="meta"></div>
  <div class="right">
    <code class="btn" id="install" title="Copy">npm i @ottomind-ai/icons-react</code>
    <button class="btn primary" id="draw">&gt; draw an icon</button>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="Search icons, tags (EN / TR), categories…" autocomplete="off">
  <span class="lbl">size</span>
  <div class="seg" id="sizes"></div>
  <label class="lbl">color <input type="color" id="color" value="#edebe3"></label>
</div>
<div class="chips" id="chips"></div>
<main><div class="grid" id="grid" role="listbox" aria-label="Icons"></div></main>

<aside id="panel" aria-live="polite">
  <button class="close" id="closePanel" aria-label="Close">×</button>
  <div class="pixview" id="pPreview"></div>
  <h2 id="pName"></h2>
  <p id="pTags"></p>
  <div class="actions">
    <button class="btn" data-act="svg">copy svg</button>
    <button class="btn" data-act="jsx">copy jsx</button>
    <button class="btn" data-act="name">copy name</button>
    <button class="btn" data-act="download">download .svg</button>
    <button class="btn" data-act="edit" style="grid-column: span 2">edit pixels</button>
  </div>
</aside>

<dialog id="editor">
  <div class="ed">
    <div>
      <div class="board" id="board" aria-label="16 by 16 pixel board"></div>
    </div>
    <div>
      <button class="close" id="closeEditor" aria-label="Close">×</button>
      <h3>draw an icon</h3>
      <div class="row">
        <div class="seg" id="tools">
          <button data-tool="#" aria-pressed="true">draw</button>
          <button data-tool="." aria-pressed="false">erase</button>
        </div>
        <button class="btn" id="clear">clear</button>
      </div>
      <div class="previews" id="edPreviews"></div>
      <div class="row"><input type="text" id="edName" placeholder="icon-name (kebab-case)"></div>
      <div class="row"><input type="text" id="edTags" placeholder="tags, comma separated (english, türkçe)"></div>
      <div class="row">
        <button class="btn primary" id="copyJson">copy icons/&lt;name&gt;.json</button>
        <button class="btn" id="copySvgEd">copy svg</button>
      </div>
      <p class="hint">Click or drag to paint. Right-click erases. The hatched 1px border stays empty. Paste the JSON into <code>icons/</code> and run <code>npm run check</code>.</p>
    </div>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__ICON_DATA__*/null;
const G = DATA.grid, PAD = DATA.padding;
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const state = { q: '', cat: null, size: 32, color: null, selected: null };

function svgFromNodes(nodes, { size = 16, color = 'currentColor', attrs = '' } = {}) {
  const kids = nodes.map(([tag, a]) => `<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${esc(v)}"`).join(' ')}/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${G} ${G}" fill="${esc(color)}" shape-rendering="crispEdges"${attrs}>${kids}</svg>`;
}
function rectsPath(px, ch) {
  const used = px.map((r) => [...r].map(() => false)); let d = '';
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
    if (px[y][x] !== ch || used[y][x]) continue;
    let x2 = x; while (x2 + 1 < G && px[y][x2 + 1] === ch && !used[y][x2 + 1]) x2++;
    let y2 = y; grow: while (y2 + 1 < G) { for (let k = x; k <= x2; k++) if (px[y2 + 1][k] !== ch || used[y2 + 1][k]) break grow; y2++; }
    for (let yy = y; yy <= y2; yy++) for (let k = x; k <= x2; k++) used[yy][k] = true;
    d += `M${x} ${y}h${x2 - x + 1}v${y2 - y + 1}h-${x2 - x + 1}z`;
  }
  return d;
}
const nodesFromPixels = (px) => [['path', { d: rectsPath(px, '#') }]];
const opts = (extra = {}) => ({ size: state.size, color: state.color || 'currentColor', ...extra });

// ---- browse
function matches(icon) {
  if (state.cat && !icon.categories.includes(state.cat)) return false;
  if (!state.q) return true;
  const hay = [icon.name, icon.pascal, ...icon.tags, ...icon.categories, ...icon.categories.map((c) => DATA.categoriesTr[c] || ''), ...icon.aliases].join(' ').toLocaleLowerCase('tr');
  return state.q.split(/\s+/).every((t) => hay.includes(t));
}
function render() {
  const list = DATA.icons.filter(matches);
  $('grid').innerHTML = list.length
    ? list.map((i) => `<button class="icon" role="option" data-name="${i.name}" aria-selected="${state.selected === i.name}" title="${i.name}">${svgFromNodes(i.nodes, { ...opts(), attrs: ' aria-hidden="true"' })}<span>${i.name}</span></button>`).join('')
    : '<div class="empty">No icon matches. Draw it and open a pull request.</div>';
  if (state.selected) showPanel(state.selected);
}
function showPanel(name) {
  const icon = DATA.icons.find((i) => i.name === name); if (!icon) return;
  state.selected = name;
  $('pPreview').innerHTML = svgFromNodes(icon.nodes, opts({ size: 192 }));
  $('pName').textContent = `${icon.name}  ·  <${icon.pascal} />`;
  $('pTags').textContent = [icon.categories.join(', '), icon.tags.join(', '), icon.aliases.length ? `aliases: ${icon.aliases.join(', ')}` : ''].filter(Boolean).join('  —  ');
  $('panel').classList.add('open');
}
function jsx(icon) {
  const p = [];
  if (state.size !== 16) p.push(`size={${state.size}}`);
  if (state.color) p.push(`color="${state.color}"`);
  return `import { ${icon.pascal} } from '@ottomind-ai/icons-react';\n\n<${icon.pascal}${p.length ? ' ' + p.join(' ') : ''} />`;
}

let toastTimer;
function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1400); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(`${label} copied`); }
  catch { toast('copy failed — the browser blocked the clipboard'); }
}
function download(name, svg) {
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  Object.assign(document.createElement('a'), { href: url, download: `${name}.svg` }).click();
  URL.revokeObjectURL(url);
}

// Embedded previews (sandboxed frames) cannot start downloads: offer copy only there.
if (window.self !== window.top) document.querySelector('[data-act="download"]').remove();
$('meta').textContent = `v${DATA.version} · ${DATA.icons.length} icons · ${G}×${G} · MIT`;
$('sizes').innerHTML = [16, 32, 48, 64].map((s) => `<button data-size="${s}" aria-pressed="${s === state.size}">${s}</button>`).join('');
$('sizes').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.size = +b.dataset.size; for (const c of $('sizes').children) c.setAttribute('aria-pressed', c === b); render();
});
const usedCats = DATA.categories.filter((c) => DATA.icons.some((i) => i.categories.includes(c)));
$('chips').innerHTML = ['all', ...usedCats].map((c) => `<button class="chip" data-cat="${c}" aria-pressed="${c === 'all'}">${c}</button>`).join('');
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.cat = b.dataset.cat === 'all' ? null : b.dataset.cat;
  for (const c of $('chips').children) c.setAttribute('aria-pressed', c === b); render();
});
$('q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLocaleLowerCase('tr'); render(); });
$('color').addEventListener('input', (e) => { state.color = e.target.value; render(); });
$('grid').addEventListener('click', (e) => { const b = e.target.closest('.icon'); if (b) { state.selected = b.dataset.name; render(); } });
$('closePanel').addEventListener('click', () => { state.selected = null; $('panel').classList.remove('open'); render(); });
$('install').addEventListener('click', () => copy($('install').textContent, 'install command'));
$('panel').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const icon = DATA.icons.find((i) => i.name === state.selected);
  const svg = svgFromNodes(icon.nodes, { size: state.size, color: state.color || 'currentColor' });
  ({ svg: () => copy(svg, 'SVG'), jsx: () => copy(jsx(icon), 'JSX'), name: () => copy(icon.name, 'name'),
     download: () => download(icon.name, svg), edit: () => openEditor(icon) })[b.dataset.act]();
});

// ---- editor
let px = Array.from({ length: G }, () => '.'.repeat(G).split(''));
let tool = '#', painting = null;
const board = $('board');
board.innerHTML = Array.from({ length: G * G }, (_, i) => {
  const x = i % G, y = Math.floor(i / G);
  const pad = x < PAD || y < PAD || x >= G - PAD || y >= G - PAD;
  return `<div data-x="${x}" data-y="${y}" class="${pad ? 'pad' : ''}"></div>`;
}).join('');
function paintCell(cell, ch) {
  const x = +cell.dataset.x, y = +cell.dataset.y;
  if (cell.classList.contains('pad') && ch !== '.') return;
  px[y][x] = ch; cell.classList.toggle('m', ch === '#');
  edPreview();
}
function loadBoard() {
  for (const cell of board.children) {
    const ch = px[+cell.dataset.y][+cell.dataset.x];
    cell.classList.toggle('m', ch === '#');
  }
  edPreview();
}
function rowsOf() { return px.map((r) => r.join('')); }
function edPreview() {
  const nodes = nodesFromPixels(rowsOf());
  $('edPreviews').innerHTML = [16, 32, 64].map((s) => `<figure>${svgFromNodes(nodes, { size: s })}<figcaption>${s}</figcaption></figure>`).join('');
}
board.addEventListener('contextmenu', (e) => e.preventDefault());
board.addEventListener('pointerdown', (e) => {
  const cell = e.target.closest('[data-x]'); if (!cell) return;
  painting = e.button === 2 ? '.' : tool; board.setPointerCapture(e.pointerId); paintCell(cell, painting);
});
board.addEventListener('pointermove', (e) => {
  if (!painting) return;
  const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest('#board [data-x]');
  if (cell) paintCell(cell, painting);
});
addEventListener('pointerup', () => { painting = null; });
$('tools').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  tool = b.dataset.tool; for (const c of $('tools').children) c.setAttribute('aria-pressed', c === b);
});
$('clear').addEventListener('click', () => { px = px.map((r) => r.map(() => '.')); loadBoard(); });
function openEditor(icon) {
  px = (icon ? icon.pixels : Array.from({ length: G }, () => '.'.repeat(G))).map((r) => r.split(''));
  $('edName').value = icon ? icon.name : '';
  $('edTags').value = icon ? icon.tags.join(', ') : '';
  loadBoard(); $('editor').showModal();
}
$('draw').addEventListener('click', () => openEditor(null));
$('closeEditor').addEventListener('click', () => $('editor').close());
$('copyJson').addEventListener('click', () => {
  const name = $('edName').value.trim() || 'new-icon';
  const icon = DATA.icons.find((i) => i.name === name);
  const tags = $('edTags').value.split(',').map((t) => t.trim()).filter(Boolean);
  const json = `{\n  "tags": ${JSON.stringify(tags.length ? tags : [name.replace(/-/g, ' ')])},\n  "categories": ${JSON.stringify(icon ? icon.categories : ['actions'])},\n  "pixels": [\n${rowsOf().map((r) => `    "${r}"`).join(',\n')}\n  ]\n}\n`;
  copy(json, `icons/${name}.json`);
});
$('copySvgEd').addEventListener('click', () => copy(svgFromNodes(nodesFromPixels(rowsOf()), { size: 16 }), 'SVG'));

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape' && !$('editor').open) $('closePanel').click();
});
render();
</script>
</body>
</html>
